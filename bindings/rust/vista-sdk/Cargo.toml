[package]
name = "vista-sdk"
version = "0.3.3"
edition = "2021"
rust-version = "1.70"
description = "Rust bindings for the DNV Vista SDK - VIS and ISO 19848"
license = "MIT"
repository = "https://github.com/dnv-opensource/vista-sdk"
homepage = "https://github.com/dnv-opensource/vista-sdk"
documentation = "https://docs.rs/vista-sdk"
readme = "README.md"
keywords = ["dnv", "iso19848", "iso-19848", "vis", "maritime"]
categories = ["api-bindings", "science"]
links = "dnv-vista-sdk-c"
include = [
    "src/**",
    "examples/**",
    "tests/**",
    "benches/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "justfile",
    "cpp/c-api/**",
    "cpp/include/**",
    "cpp/src/**",
    "cpp/CMakeLists.txt",
    "cpp/cmake/**",
    "cpp/tools/**",
    "resources/**",
    "schemas/**",
]

[features]
default = ["vendored"]
vendored = []

[package.metadata.docs.rs]
features = ["vendored"]

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1"

[[example]]
name = "core_codebooks"
path = "examples/core/codebooks.rs"
